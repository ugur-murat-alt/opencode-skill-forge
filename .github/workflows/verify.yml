name: Verify Skill Forge
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: forge-ci-only
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forge_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      FORGE_TEST_POSTGRES_URL: postgres://postgres:forge-ci-only@127.0.0.1:5432/forge_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run typecheck
      - run: bun run build
      - name: Prepare real sandbox runtimes
        run: |
          docker pull node@sha256:ba849c60be29959425b8734d57b8b4b7d56f98edd9504c9af091d5281095a71e
          docker pull python@sha256:ed86c82274b3c69b52fb5820f358f0bd7df0b603332063cb5c6e32bd220c3e6e
      - run: bun test
      - name: Real OIDC and TLS acceptance
        run: node scripts/oidc-smoke.mjs
      - run: bun run build:plugin
      - run: npm pack --dry-run
      - name: Build and verify container lifecycle
        run: |
          docker build -t skill-forge-local:acceptance .
          node scripts/container-smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: server-acceptance-evidence
          path: |
            docs/evidence/p03-live-oidc.json
            docs/evidence/p15-container-smoke.json
          if-no-files-found: warn
  web-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: |
          wget -q -O /tmp/google-chrome.pub https://dl.google.com/linux/linux_signing_key.pub
          sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/google-chrome.gpg /tmp/google-chrome.pub
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y -q google-chrome-stable
      - run: bun run build:plugin
      - name: Real browser acceptance gate
        run: |
          set -o pipefail
          mkdir -p artifacts/web-acceptance
          node scripts/web-acceptance.mjs --port 38471 \
            --report artifacts/web-acceptance/report.json \
            --shots artifacts/web-acceptance/shots \
            2> artifacts/web-acceptance/stderr.log \
            | tee artifacts/web-acceptance/stdout.log
      - name: Verify acceptance artifact identity and log parity
        if: always()
        run: |
          node scripts/web-acceptance.mjs --verify \
            --report artifacts/web-acceptance/report.json \
            --stdout artifacts/web-acceptance/stdout.log
      - name: Failure path gate (intentional UI fault must stay red)
        if: always()
        run: |
          set +e
          set -o pipefail
          mkdir -p artifacts/web-acceptance/failure
          node scripts/web-acceptance.mjs --port 38472 \
            --report artifacts/web-acceptance/failure/report.json \
            --shots artifacts/web-acceptance/failure/shots \
            --inject-failure login --fail-fast \
            2> artifacts/web-acceptance/failure/stderr.log \
            | tee artifacts/web-acceptance/failure/stdout.log
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::intentional UI fault did not fail the acceptance gate"
            exit 1
          fi
          node scripts/web-acceptance.mjs --verify --expect-failure \
            --report artifacts/web-acceptance/failure/report.json \
            --stdout artifacts/web-acceptance/failure/stdout.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: web-acceptance-evidence
          path: artifacts/web-acceptance
          if-no-files-found: error
  portable-artifact:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Real Node lifecycle
        run: bun test test/daemon-stop.test.ts
      - name: Clean production artifact
        run: node scripts/package-smoke.mjs docs/evidence/ci-clean-package.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: package-evidence-${{ matrix.os }}
          path: docs/evidence/ci-clean-package.json
          if-no-files-found: warn
