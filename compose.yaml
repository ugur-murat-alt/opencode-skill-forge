services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: skill_forge
      POSTGRES_USER: skill_forge
      POSTGRES_PASSWORD: ${FORGE_POSTGRES_PASSWORD:?Set a random hex password}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U skill_forge -d skill_forge"]
      interval: 5s
      timeout: 5s
      retries: 12
  forge:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SKILL_FORGE_PROFILE: server
      SKILL_FORGE_PORT: "38475"
      SKILL_FORGE_DATA_DIR: /data
      SKILL_FORGE_POSTGRES_URL: postgres://skill_forge:${FORGE_POSTGRES_PASSWORD:?Set a random hex password}@postgres:5432/skill_forge
      SKILL_FORGE_PUBLIC_URL: ${FORGE_PUBLIC_URL:?Set the external HTTPS origin}
      SKILL_FORGE_OIDC_ISSUER: ${FORGE_OIDC_ISSUER:?Set the HTTPS OIDC issuer}
      SKILL_FORGE_OIDC_CLIENT_ID: ${FORGE_OIDC_CLIENT_ID:?Set the OIDC client ID}
      SKILL_FORGE_OIDC_CLIENT_SECRET: ${FORGE_OIDC_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:38475:38475"
    volumes:
      - forge_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  database:
  forge_data:
